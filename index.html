  <!-- Google Fonts: Inter Tight -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body class="main">

<div class="cursor-follower"></div>

<!-- 로딩: 화면 맨 아래의 출근길이 로딩바 역할. 햄스터가 걸어간 만큼 길이 채워지고, 회사 문이 100%. 동작은 main.js -->
<div class="main_loader" id="mainLoader" aria-hidden="true">
  <div class="main_loader_top"><span>(Home)</span><span>On the way to work</span></div>
  <div class="main_loader_center">
    <span class="main_loader_ampm">AM</span>
    <strong class="main_loader_clock"><span>08</span><i>:</i><span id="mainLoaderMin">50</span></strong>
    <p id="mainLoaderMsg">오늘도 출근 중…</p>
  </div>
  <div class="main_loader_scene" id="mainLoaderScene">
    <canvas id="mainLoaderCanvas" width="320" height="58"></canvas>
    <div class="main_loader_bubble" id="mainLoaderBubble"><span id="mainLoaderBubbleText">출근 중</span> <b id="mainLoaderPct">0%</b></div>
  </div>
</div>

<!-- 메뉴: 사원증 메뉴(.id-badge)는 common.js 가 모든 페이지에 똑같이 만들어 넣는다 -->


<div class="all_wrap">
	

	<div id="fullpage">

		<section class="section" id="section1">
            
			<div class="main_wrap hero_video_wrap">

                <video class="hero_bg_video" autoplay muted loop playsinline>
                    <source src="resources/video/hamster_bg.mp4" type="video/mp4">
                </video>

                <div class="hero_copy">

                    <h1 class="hero_copy_top">확실한 보상</h1>

                    <p class="hero_copy_mid">
                        죽을똥 살똥 열심히<br>
                        일하는 중...
                    </p>

                    <!-- 영상(1892x1096) 좌표계에 맞춘 스테이지: object-fit: cover와 동일하게 확대/크롭 -->
                    <div class="hero_stage">
                        <span class="hero_copy_note">밥은 먹고 살아야지</span>
                        <svg class="hero_note_line" viewBox="0 0 1892 1096" preserveAspectRatio="none" aria-hidden="true">
                            <polyline points="309,878 377,878 429,938" />
                        </svg>
                    </div>

                    <p class="hero_copy_bottom">확실한 일꾼</p>

                </div>

		    </div>
        </section>

    </div>
</div>

<!-- 확실한 일꾼 스크램블 텍스트 효과 -->
<script src="resources/js/main.js"></script>


</body>

</html>
