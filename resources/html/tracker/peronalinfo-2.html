<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <title>Tracker</title>
    <link rel="icon" href="./public/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./public/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./public/apple-touch-icon.png" />

    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/form.css" />
    <link rel="stylesheet" href="./css/contents.css" />
  </head>
  <body>
    <div class="main">
      <section class="top-section">
        <div class="top-title">
          <div class="spacer-24"></div>
          <h1 class="title-b">개인 정보 등록</h1>
          <button class="icon-close" type="button" aria-label="닫기" onclick="location.href='./login.html'"><img src="./public/icon-close.svg" alt="" /></button>
        </div>
      </section>
      <ol class="signup-group" aria-label="등록 단계">
        <li class="signup-step step-user" aria-label="1단계 기본 정보"></li>
        <li class="signup-step step-check is-current" aria-current="step" aria-label="2단계 성별"></li>
        <li class="signup-step step-pin" aria-label="3단계 주소"></li>
        <li class="signup-step step-phone" aria-label="4단계 전화번호"></li>
        <li class="signup-step step-body" aria-label="5단계 신체 정보"></li>
      </ol>

      <section class="text-section">
        <div class="form-text-group">
          <div class="form-bluebox">
            <b>설문 결과는 참여자님의 건강활동에 도움이 됩니다. 선택하신 답변은 '설정'에서 언제든지 변경가능합니다.</b>
          </div>
          <p class="form-text blue">* 귀하의 일반적 사항에 관한 질문으로, 빠짐없이 솔직하게 응답해 주시기 바랍니다. 모르는 부분에 대해서는 넘어가셔도 됩니다.</p>
        </div>
      </section>
      <section class="form-section">
        <h2 class="form-tittle">귀하의 성별은 무엇입니까?</h2>
        <label class="check-box-parent">
          <input type="radio" name="gender" />
          <span class="check-ui">
            <span class="check-type">남성</span>
            <span class="check-icon"><span class="check-svg"></span></span>
          </span>
        </label>
        <label class="check-box-parent">
          <input type="radio" name="gender" />
          <span class="check-ui">
            <span class="check-type">여성</span>
            <span class="check-icon"><span class="check-svg"></span></span>
          </span>
        </label>
      </section>

      <section class="bottom-section">
        <div class="bottom-button">
          <button class="button line" type="button" onclick="location.href='./peronalinfo-1.html'">이전</button>
          <button class="button square stanby" type="button" onclick="location.href='./peronalinfo-3.html'">다음</button>
        </div>
      </section>
    </div>
  </body>
</html>
