<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <title>Tracker</title>
    <link rel="icon" href="./public/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./public/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./public/apple-touch-icon.png" />

    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/form.css" />
    <link rel="stylesheet" href="./css/contents.css" />
  </head>
  <body>
    <div class="main bg-half">
      <section class="top-section unline">
        <div class="top-title">
          <button class="icon-arrow" type="button" aria-label="뒤로" onclick="location.href='./login.html'"><img src="./public/icon-chevron-left.svg" alt="" /></button>
          <h1 class="title-b">패스워드 찾기</h1>
          <div class="spacer-24"></div>
        </div>
      </section>

      <section class="form-section">
        <div class="form-group">
          <label class="form-name" for="userId">아이디</label>
          <div class="field lg"><input id="userId" type="text" placeholder="아이디를 입력해 주세요" autocomplete="username" /></div>
        </div>
        <div class="form-group">
          <label class="form-name" for="phone">전화번호</label>
          <div class="form-input2">
            <div class="field lg"><input id="phone" type="tel" inputmode="numeric" placeholder="전화번호를 입력해 주세요" autocomplete="tel" /></div>
            <button class="button short stanby" type="button">인증번호</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-name" for="code">인증번호</label>
          <div class="field lg on">
            <input id="code" type="text" inputmode="numeric" placeholder="인증번호를 입력해 주세요" autocomplete="one-time-code" />
            <span class="input-time">02:00</span>
          </div>
          <p class="form-text blue">- 인증되었습니다</p>
        </div>
        <div class="button-flex">
          <button class="button line" type="button">재발송</button>
          <button class="button square" type="button">인증 확인</button>
        </div>
        <button class="button square stanby" id="findButton" type="button">패스워드 찾기</button>
      </section>
    </div>

    <!-- 결과 팝업 -->
    <div class="pop_wrap" id="resultPop" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
      <div class="popup-parent">
        <div class="popup-text">
          <p class="popup-title" id="resultTitle">임시 패스워드 <b>1234qwer</b></p>
          <p class="form-text red">*로그인 후 패스워드를 바꿔주세요</p>
        </div>
        <button class="popup-button" type="button">확인</button>
      </div>
    </div>

    <script>
      // 패스워드 찾기를 누르면 결과 팝업, 확인을 누르면 로그인으로 이동
      const pop = document.getElementById('resultPop');
      document.getElementById('findButton').addEventListener('click', () => {
        pop.classList.add('is-active');
        pop.querySelector('.popup-button').focus();
      });
      pop.querySelector('.popup-button').addEventListener('click', () => {
        location.href = './login.html';
      });
    </script>
  </body>
</html>
