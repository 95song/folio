<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <title>Tracker</title>
    <link rel="icon" href="./public/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./public/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./public/apple-touch-icon.png" />

    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/form.css" />
    <link rel="stylesheet" href="./css/contents.css" />
  </head>
  <body>
    <div class="main">
      <section class="top-section">
        <div class="top-title">
          <div class="spacer-24"></div>
          <h1 class="title-b">개인 정보 등록</h1>
          <button class="icon-close" type="button" aria-label="닫기" onclick="location.href='./login.html'"><img src="./public/icon-close.svg" alt="" /></button>
        </div>
      </section>
      <ol class="signup-group" aria-label="등록 단계">
        <li class="signup-step step-user" aria-label="1단계 기본 정보"></li>
        <li class="signup-step step-check" aria-label="2단계 성별"></li>
        <li class="signup-step step-pin is-current" aria-current="step" aria-label="3단계 주소"></li>
        <li class="signup-step step-phone" aria-label="4단계 전화번호"></li>
        <li class="signup-step step-body" aria-label="5단계 신체 정보"></li>
      </ol>

      <section class="form-section">
        <h2 class="form-tittle">참여자님의 개인정보를 입력해주세요</h2>
        <!-- data-address: 주소 칸 / data-address-search: 그 칸을 채울 검색 버튼 / data-address-detail: 고른 뒤 커서를 옮길 칸 -->
        <div class="form-group">
          <label class="form-name" for="addr">주소</label>
          <div class="form-input2">
            <div class="field lg"><input id="addr" type="text" placeholder="주소 검색을 눌러 주세요" readonly data-address data-address-detail="#addr2" /></div>
            <button class="button short" type="button" data-address-search="#addr">주소 검색</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-name" for="addr2">상세주소</label>
          <div class="field lg"><input id="addr2" type="text" placeholder="상세주소를 입력해 주세요" autocomplete="address-line2" /></div>
        </div>
        <!-- 직장 주소는 선택 항목: data-optional 칸은 '다음' 활성 조건에서 빠진다 -->
        <div class="form-group">
          <label class="form-name" for="work">직장 주소 <span class="optional">(선택)</span></label>
          <div class="form-input2">
            <div class="field lg"><input id="work" type="text" placeholder="주소 검색을 눌러 주세요" readonly data-optional data-address data-address-detail="#work2" /></div>
            <button class="button short" type="button" data-address-search="#work">주소 검색</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-name" for="work2">직장 상세주소 <span class="optional">(선택)</span></label>
          <div class="field lg"><input id="work2" type="text" placeholder="상세주소를 입력해 주세요" data-optional /></div>
        </div>
      </section>

      <section class="bottom-section">
        <div class="bottom-button">
          <button class="button line" type="button" onclick="location.href='./peronalinfo-2.html'">이전</button>
          <button class="button square stanby" type="button" onclick="location.href='./peronalinfo-4.html'">다음</button>
        </div>
      </section>
    </div>

    <script src="./js/address.js"></script>
  </body>
</html>
