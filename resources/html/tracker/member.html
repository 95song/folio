<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <title>Tracker</title>
    <link rel="icon" href="./public/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./public/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./public/apple-touch-icon.png" />

    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/form.css" />
    <link rel="stylesheet" href="./css/contents.css" />
  </head>
  <body>
    <div class="main bg-fade">
      <header class="page-header">
        <h1 class="page-title">회원정보 수정하기</h1>
        <button class="icon-button" type="button" aria-label="닫기" onclick="location.href='./mypage.html'">
          <img src="./public/icon-close.svg" alt="" />
        </button>
      </header>

      <section class="info-card">
        <h2 class="form-title">회원정보</h2>
        <dl class="info-list">
            <div class="info-row"><dt>이름</dt><dd>홍길동</dd></div>
            <div class="info-row"><dt>생년월일</dt><dd>1990.11.21</dd></div>
            <div class="info-row"><dt>핸드폰 번호</dt><dd>010-1234-5678</dd></div>
            <div class="info-row"><dt>성별</dt><dd>남성</dd></div>
            <div class="info-row"><dt>키</dt><dd>175cm</dd></div>
            <div class="info-row"><dt>체중</dt><dd>80kg</dd></div>
        </dl>
      </section>

      <section class="panel-section">
        <form data-confirm="#confirmPop" data-confirm-next="./mypage.html">
          <h2 class="form-title">회원정보 수정</h2>
          <div class="form-rows">
              <div class="form-row">
                <label class="form-label" for="member-name">이름</label>
                <div class="field">
                  <input id="member-name" type="text" placeholder="홍길동" />
                </div>
              </div>
              <div class="form-row">
                <label class="form-label" for="birth">생년월일</label>
                <div class="field" data-calendar="single">
                  <input id="birth" type="text" placeholder="1990.11.21" readonly aria-haspopup="dialog" />
                  <img src="./public/icon-calendar.svg" alt="" />
                  <div class="calendar" role="dialog" aria-label="날짜 선택"></div>
                </div>
              </div>
              <div class="form-row">
                <label class="form-label" for="member-gender">성별</label>
                <div class="field">
                  <select id="member-gender"><option>남성</option><option>여성</option></select>
                </div>
              </div>
              <div class="form-row">
                <label class="form-label" for="member-height">키</label>
                <div class="field">
                  <input id="member-height" type="text" inputmode="decimal" placeholder="175" />
                  <span class="input-unit">cm</span>
                </div>
              </div>
              <div class="form-row">
                <label class="form-label" for="member-weight">체중</label>
                <div class="field">
                  <input id="member-weight" type="text" inputmode="decimal" placeholder="80" />
                  <span class="input-unit">kg</span>
                </div>
              </div>
          </div>
          <button class="button square" type="submit">수정하기</button>
        </form>
      </section>

      <nav class="tab-bar">
        <button class="tab-button" type="button" onclick="location.href='./main-good.html'">
          <span class="tab-icon"><img src="./public/tab-home-off.svg" alt="" /></span>
          <span class="tab-name">홈</span>
        </button>
        <button class="tab-button" type="button" onclick="location.href='./location.html'">
          <span class="tab-icon"><img src="./public/tab-location-off.svg" alt="" /></span>
          <span class="tab-name">위치 데이터</span>
        </button>
        <button class="tab-button" type="button" onclick="location.href='./heatmap.html'">
          <span class="tab-icon"><img src="./public/tab-heatmap-off.svg" alt="" /></span>
          <span class="tab-name">히트맵</span>
        </button>
        <button class="tab-button on" type="button" onclick="location.href='./mypage.html'">
          <span class="tab-icon"><img src="./public/tab-setting-on.svg" alt="" /></span>
          <span class="tab-name">환경설정</span>
        </button>
      </nav>
    </div>

    <!-- 확인 팝업 (js/confirm.js) -->
    <div class="pop_wrap" id="confirmPop" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <div class="popup-parent">
        <div class="popup-text">
          <p class="popup-title" id="confirmTitle">수정하시겠습니까?</p>
        </div>
        <div class="popup-buttons">
          <button class="popup-button cancel" type="button">취소</button>
          <button class="popup-button" type="button">확인</button>
        </div>
      </div>
    </div>

    <script src="./js/select.js"></script>
    <script src="./js/calendar.js"></script>
    <script src="./js/confirm.js"></script>
  </body>
</html>
