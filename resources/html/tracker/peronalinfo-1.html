<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <title>Tracker</title>
    <link rel="icon" href="./public/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./public/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./public/apple-touch-icon.png" />

    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/form.css" />
    <link rel="stylesheet" href="./css/contents.css" />
  </head>
  <body>
    <div class="main">
      <section class="top-section">
        <div class="top-title">
          <div class="spacer-24"></div>
          <h1 class="title-b">개인 정보 등록</h1>
          <button class="icon-close" type="button" aria-label="닫기" onclick="location.href='./login.html'"><img src="./public/icon-close.svg" alt="" /></button>
        </div>
      </section>
      <ol class="signup-group" aria-label="등록 단계">
        <li class="signup-step step-user is-current" aria-current="step" aria-label="1단계 기본 정보"></li>
        <li class="signup-step step-check" aria-label="2단계 성별"></li>
        <li class="signup-step step-pin" aria-label="3단계 주소"></li>
        <li class="signup-step step-phone" aria-label="4단계 전화번호"></li>
        <li class="signup-step step-body" aria-label="5단계 신체 정보"></li>
      </ol>

      <section class="form-section">
        <h2 class="form-tittle">참여자님의 개인정보를 입력해주세요</h2>
        <div class="form-group">
          <label class="form-name" for="name">이름</label>
          <div class="field lg"><input id="name" type="text" placeholder="이름을 입력해 주세요" autocomplete="name" /></div>
        </div>
        <div class="form-group">
          <label class="form-name" for="rrn1">주민등록번호</label>
          <div class="form-input2">
            <div class="field lg"><input id="rrn1" type="text" inputmode="numeric" maxlength="6" placeholder="⦁⦁⦁⦁⦁⦁" /></div>
            <span class="dash">-</span>
            <div class="field lg"><input id="rrn2" type="password" inputmode="numeric" maxlength="7" placeholder="⦁⦁⦁⦁⦁⦁⦁" aria-label="주민등록번호 뒷자리" /></div>
          </div>
        </div>
      </section>

      <section class="bottom-section">
        <div class="bottom-button">
          <button class="button line" type="button" onclick="location.href='./signup-1.html'">이전</button>
          <button class="button square stanby" type="button" onclick="location.href='./peronalinfo-2.html'">다음</button>
        </div>
      </section>
    </div>
  </body>
</html>
